<!DOCTYPE html>
<html lang="fr-FR">

	<head>
		<meta charset="UTF-8">
		<meta http-equiv="X-UA-Compatible" content="IE=edge">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>🪐 NeoOrbital 🪐</title>
		<link rel="icon" type="image/ico" href="favicon.ico">
		<link rel='stylesheet' id='base-css' href='assets/css/base.css' type='text/css' media='all' />
		<link rel='stylesheet' id='info-css' href='assets/css/info.css' type='text/css' media='all' />
		<link rel='stylesheet' id='help-css' href='assets/css/help.css' type='text/css' media='all' />
		<link rel='stylesheet' id='base-css' href='assets/css/arcadebutton.css' type='text/css' media='all' />
		<link rel='stylesheet' id='touchdir-css' href='assets/css/touchdir.css' type='text/css' media='all' />
	</head>

	<body>
		<div id="lunar" class="">
			<div id="info">
				<div class="github">
					<a target="github" title="open new tab with orbital's github page"
						href="https://github.com/patobeur/orbital"> </a>
				</div>
			</div>
			<div id="touchdir">
				<div id="touch-up" class="push--flat mobile up">up</div>
				<div id="touch-right" class="push--flat mobile right">right</div>
				<div id="touch-down" class="push--flat mobile down">down</div>
				<div id="touch-left" class="push--flat mobile left">left</div>
			</div>
			<div id="starter" class='starter'>
				<header>
					<h2>NeoOrbital</h2>
					<button id="startgame" class="push--skeuo">Jouer</button>
					<button href="#gogo" class="push--flat keyboard">info</button>
				</header>
			</div>
			<div id="pause">game paused</div>
		</div>
		<script src='assets/js/class/utils.js' id='utils-js'></script>
		<script src='assets/js/class/data.js' id='data-js'></script>
		<script src='assets/js/class/CssManager.js' id='cssManager-js'></script>
		<script src='assets/js/class/DomManager.js' id='domManager-js'></script>
		<script src='assets/js/class/UiManager.js' id='uiManager-js'></script>
		<script src='assets/js/class/DivManager.js' id='divManager-js'></script>
		<script src='assets/js/class/MobFactory.js' id='mobfactory-js'></script>
		<script src='assets/js/class/physic.js' id='physic-js'></script>
		<script src='assets/js/class/tutorial.js' id='tutorial-js'></script>
		<script src='assets/js/class/playerController.js' id='playerController-js'></script>
		<script src='assets/js/class/Ordinator.js' id='ordinator-js'></script>
		<script src='assets/js/main.js' id='main-js'></script>
	</body>

</html>
